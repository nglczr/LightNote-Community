name: "🐞 Relatar um bug"
description: Relate um problema ou comportamento inesperado no LightNote.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! Quanto mais detalhes, mais rápido conseguimos corrigir.
        Para sugestões e ideias, use as [Discussions](https://github.com/nglczr/LightNote-Community/discussions).
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Liste os passos para o problema aparecer.
      placeholder: |
        1. Abrir ...
        2. Clicar em ...
        3. Ver o erro ...
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      options:
        - Windows
        - Linux
        - Android
    validations:
      required: true
  - type: dropdown
    id: edicao
    attributes:
      label: Edição
      options:
        - LightNote (grátis)
        - LightNote Core (Microsoft Store)
        - LightNote para Android (prévia)
        - Não sei
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do LightNote
      description: No computador, Ajuda → Sobre; no Android, toque e segure o ícone do LightNote → Informações do app.
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Sistema e versão
      placeholder: Windows 11 23H2 · Ubuntu 24.04 (GNOME, Wayland) · Android 14, Pixel 7
    validations:
      required: false
