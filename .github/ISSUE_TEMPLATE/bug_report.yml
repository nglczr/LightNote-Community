name: "🐞 Relatar um bug"
description: Relate um problema ou comportamento inesperado no LightNote.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! Quanto mais detalhes, mais rápido conseguimos corrigir.
        Para sugestões e ideias, use as [Discussions](https://github.com/nglczr/LightNote-Community/discussions).
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Liste os passos para o problema aparecer.
      placeholder: |
        1. Abrir ...
        2. Clicar em ...
        3. Ver o erro ...
    validations:
      required: true
  - type: dropdown
    id: edicao
    attributes:
      label: Edição
      options:
        - LightNote (grátis)
        - LightNote Core (Microsoft Store)
        - Não sei
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      description: Veja em Ajuda → Sobre (ex.: 0.1 alfa).
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: Windows 11 23H2
    validations:
      required: false
